[package]
name = "cardbox"
version = "0.1.0"
edition = "2024"
authors = ["Yutaka Nishimura"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ynishi/cardbox"
homepage = "https://github.com/ynishi/cardbox"
description = "An append-only record of every run: samples, evals, checkpoints, params, tags and aliases over one eventsdb log, with a Teal policy layer and a CLI."
readme = "README.md"
keywords = ["event-sourcing", "experiment-tracking", "sqlite", "lua", "teal"]
categories = ["command-line-utilities", "database", "development-tools"]
# The crate tarball carries the Teal it embeds and the one dependency's source under
# `patches/htlx/` (resolved through `htl.toml`'s `[check] paths`), and not the manifest
# that would make htl try to install that dependency into `.htl/modules/` during the
# build — writing into the tree `cargo publish` verifies is what it refuses. Nor the
# dependency's own project files, tests and docs, nor this project's dev tooling.
exclude = [
    "mlua-pkg.toml",
    "mlua-pkg.lock",
    "patches/htlx/htl.toml",
    "patches/htlx/mlua-pkg.toml",
    "patches/htlx/README.md",
    "patches/htlx/.github/**",
    "patches/htlx/.gitignore",
    "patches/htlx/tests/**",
    "e2e/**",
    "tools/**",
    "justfile",
    "workspace/**",
]

[dependencies]
# 0.5.1 carries what main was pinned for: an installed dependency read at its entry
# (ynishi/htl#204), so the macros see `htlx.*`, and `Htl::install_std`.
htl = "0.5.1"
anyhow = "1"
eventsdb = { version = "0.5.0", features = ["sqlite"] }
# One current-thread runtime, owned by the store, which `block_on`s every call on it.
# `time` as well as `rt`: eventsdb backs a contended write off with `tokio::time::sleep`,
# and a runtime with no timer panics there instead of waiting.
tokio = { version = "1", features = ["rt", "time"] }
serde_json = "1"
# The crate behind htl's `std.json`, named here for its two converters: `store::json` runs
# the same code the Teal side does, so the `__jsontype` tag that tells `[]` from `{}`
# survives the crossing. Default features; they cost only serde_json, which is already here.
mlua-batteries = "0.7.2"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"

# The Teal checker runs inside htl's proc macros; the dev profile would build it
# unoptimised and make every `cargo build` that touches a .tl about 3x slower.
[profile.dev.build-override]
opt-level = 3
